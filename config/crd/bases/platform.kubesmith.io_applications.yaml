apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.platform.kubesmith.io
spec:
  group: platform.kubesmith.io
  names:
    kind: Application
    listKind: ApplicationList
    plural: applications
    singular: application
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - source
            - destination
            properties:
              source:
                type: object
                required:
                - repoUrl
                - path
                - revision
                properties:
                  repoUrl:
                    type: string
                  path:
                    type: string
                  revision:
                    type: string
              destination:
                type: object
                required:
                - namespace
                properties:
                  namespace:
                    type: string
              deploy:
                type: object
                properties:
                  syncPolicy:
                    type: string
                    enum:
                    - auto
                    - manual
                  prune:
                    type: boolean
                  selfHeal:
                    type: boolean
              monitoring:
                type: object
                properties:
                  metrics:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      port:
                        type: string
                      path:
                        type: string
          status:
            type: object
            properties:
              phase:
                type: string
              message:
                type: string
              lastSyncedAt:
                type: string
                format: date-time
    subresources:
      status: {}
