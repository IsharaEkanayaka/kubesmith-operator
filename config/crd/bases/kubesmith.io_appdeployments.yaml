---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appdeployments.kubesmith.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: kubesmith.io
  names:
    kind: AppDeployment
    listKind: AppDeploymentList
    plural: appdeployments
    singular: appdeployment
    shortNames:
      - appdep
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyPods
        - name: Total
          type: integer
          jsonPath: .status.totalPods
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: AppDeployment is the Schema for the appdeployments API.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: AppDeploymentSpec defines the desired state of AppDeployment.
              type: object
              required:
                - type
              properties:
                type:
                  description: "Deployment mechanism: helm or manifest."
                  type: string
                  enum: [helm, manifest]
                helm:
                  description: Helm chart configuration. Required when type=helm.
                  type: object
                  required: [repoUrl, chart]
                  properties:
                    repoUrl:
                      type: string
                    chart:
                      type: string
                    version:
                      type: string
                    values:
                      type: string
                    releaseName:
                      type: string
                manifest:
                  description: Raw Kubernetes YAML. Required when type=manifest.
                  type: string
                podSelector:
                  description: Label selector for finding pods (manifest type).
                  type: object
                  additionalProperties:
                    type: string
            status:
              description: AppDeploymentStatus defines the observed state.
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                readyPods:
                  type: integer
                  format: int32
                totalPods:
                  type: integer
                  format: int32
                deployedVersion:
                  type: string
                lastDeployedAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
