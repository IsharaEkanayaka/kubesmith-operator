---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesmith-operator-manager-role
rules:
  # kubesmith CRDs
  - apiGroups: [kubesmith.io]
    resources: [appdeployments, appmonitors]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kubesmith.io]
    resources: [appdeployments/status, appmonitors/status]
    verbs: [get, update, patch]
  - apiGroups: [kubesmith.io]
    resources: [appdeployments/finalizers]
    verbs: [update]
  # Prometheus Operator CRDs
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, prometheusrules]
    verbs: [get, list, watch, create, update, patch, delete]
  # Pod observation
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Helm stores release metadata in Secrets
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Manifest apply — broad permissions so the operator can manage any resource
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  # Leader-election
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
