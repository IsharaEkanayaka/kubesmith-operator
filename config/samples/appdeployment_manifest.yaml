apiVersion: kubesmith.io/v1alpha1
kind: AppDeployment
metadata:
  name: hello-app
  namespace: staging
spec:
  type: manifest
  podSelector:
    app: hello-app
  manifest: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: hello-app
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: hello-app
      template:
        metadata:
          labels:
            app: hello-app
        spec:
          containers:
            - name: hello
              image: hashicorp/http-echo:latest
              args: ["-text=hello from kubesmith"]
              ports:
                - containerPort: 5678
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: hello-app
    spec:
      selector:
        app: hello-app
      ports:
        - port: 80
          targetPort: 5678
